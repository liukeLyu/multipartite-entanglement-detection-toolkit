[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medt"
version = "0.1.0.dev0"
description = "Multipartite Entanglement Detection Toolkit: certify and quantify entanglement in quantum states"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Liuke Lyu" }]
dependencies = ["numpy>=1.24", "scipy>=1.10", "cvxpy>=1.4"]

[project.optional-dependencies]
rains = ["picos>=2.4", "qics>=1.0"]
dev = ["pytest>=7", "ruff>=0.5", "picos>=2.4", "qics>=1.0"]

[tool.pytest.ini_options]
markers = ["slow: takes about a minute (run with -m slow)"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741"]  # I, X, l are standard physics names
